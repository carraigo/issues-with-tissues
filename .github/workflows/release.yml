name: release
# Push a tag like v0.5.0 to build IssuesWithTissues-v0.5.0.zip and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luajit zip
      - run: luajit tests/run.lua
      - name: Version in the TOC and Core.lua matches the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          tr -d '\r' < IssuesWithTissues/IssuesWithTissues.toc | grep -qx "## Version: $v"
          tr -d '\r' < IssuesWithTissues/Core.lua | grep -q "ns.VERSION = \"$v\""
      - name: Zip the addon folder
        run: zip -r "IssuesWithTissues-${GITHUB_REF_NAME}.zip" IssuesWithTissues
      - name: Release notes from CHANGELOG.md
        run: tr -d '\r' < CHANGELOG.md | awk -v v="## ${GITHUB_REF_NAME#v}" 'index($0, v) == 1 {f = 1; next} /^## / {f = 0} f' | tr -d '\r' > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "IssuesWithTissues-${GITHUB_REF_NAME}.zip" --title "Issues with Tissues ${GITHUB_REF_NAME}" --notes-file notes.md
