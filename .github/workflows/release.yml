name: release
# Push a tag like v0.5.0 to build IssuesWithTissues-v0.5.0.zip and attach it to a GitHub release.
# A tag like v0.8.0-beta.1 makes a pre-release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # all tags, to find the previous release
      - run: sudo apt-get update && sudo apt-get install -y luajit zip
      - run: luajit tests/run.lua
      - name: Version in the TOC and Core.lua matches the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          tr -d '\r' < IssuesWithTissues/IssuesWithTissues.toc | grep -qx "## Version: $v"
          tr -d '\r' < IssuesWithTissues/Core.lua | grep -q "ns.VERSION = \"$v\""
      - name: Zip the addon folder
        run: zip -r "IssuesWithTissues-${GITHUB_REF_NAME}.zip" IssuesWithTissues
      - name: Release notes from CHANGELOG.md
        # Every section since the previous release, so a version that was never tagged
        # (like 0.7.1) still shows up in the notes.
        run: |
          cur="${GITHUB_REF_NAME#v}"
          prev=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | { cat; echo "$cur"; } | sort -uV | grep -B1 -x "$cur" | head -1)
          [ "$prev" = "$cur" ] && prev=""
          tr -d '\r' < CHANGELOG.md | awk -v cur="$cur" -v prev="$prev" '/^## / { v = $2; if (v == cur) on = 1; else if (on && prev != "" && v == prev) exit } on' > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## $cur' section"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a dash (v0.8.0-beta.1) is a test build: marked as a pre-release, so the
        # "latest release" link and badge keep pointing at the last full release.
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "IssuesWithTissues-${GITHUB_REF_NAME}.zip" --title "Issues with Tissues ${GITHUB_REF_NAME}" --notes-file notes.md $pre

      # Needs: repo secret CF_API_TOKEN (a CurseForge API token) and repo variable
      # CF_GAME_VERSIONS
      - name: Upload to CurseForge
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT: "1825695"
          CF_GAME_VERSIONS: ${{ vars.CF_GAME_VERSIONS }}
        run: |
          api="https://wow.curseforge.com/api"
          curl -sS --fail-with-body -H "X-Api-Token: $CF_TOKEN" "$api/game/versions" > versions.json
          ids=$(jq -c --arg want "$CF_GAME_VERSIONS" \
            '($want | split(",") | map(gsub("^ +| +$"; ""))) as $w | [ .[] | select(.name as $n | $w | index($n)) | .id ]' versions.json)
          if [ "$ids" = "[]" ] || [ -z "$CF_GAME_VERSIONS" ]; then
            echo "No CurseForge game version matches '$CF_GAME_VERSIONS'. Available:"
            jq -r '.[] | "\(.id)  \(.name)"' versions.json | sort -k2 -V | tail -60
            exit 1
          fi
          type=release
          case "$GITHUB_REF_NAME" in *alpha*) type=alpha ;; *-*) type=beta ;; esac
          jq -n --rawfile notes notes.md --argjson ids "$ids" --arg name "Issues with Tissues ${GITHUB_REF_NAME}" --arg type "$type" \
            '{changelog: $notes, changelogType: "markdown", displayName: $name, gameVersions: $ids, releaseType: $type}' > metadata.json
          curl -sS --fail-with-body -H "X-Api-Token: $CF_TOKEN" \
            -F "metadata=<metadata.json" \
            -F "file=@IssuesWithTissues-${GITHUB_REF_NAME}.zip" \
            "$api/projects/$CF_PROJECT/upload-file"
          echo
