name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y luajit lua-check
      - name: luacheck
        run: luacheck IssuesWithTissues
      - run: luajit tests/run.lua
      - name: speed test (500-member guild)
        run: luajit tests/speed.lua
